<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinicSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --navy:#0F172A;
  --navy-soft:#1E293B;
  --teal:#14B8A6;
  --teal-dark:#0D9488;
  --teal-tint:#ECFDF9;
  --bg:#F8FAFC;
  --surface:#FFFFFF;
  --surface-2:#F1F5F9;
  --text:#0F172A;
  --muted:#64748B;
  --border:#E2E8F0;
  --success:#16A34A;
  --success-tint:#F0FDF4;
  --warning:#D97706;
  --warning-tint:#FFFBEB;
  --danger:#DC2626;
  --danger-tint:#FEF2F2;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 10px 30px -8px rgba(15,23,42,.14), 0 4px 10px -4px rgba(15,23,42,.08);
  --shadow-lg:0 24px 60px -16px rgba(15,23,42,.28);
  --font-display:'Cairo','Tajawal',sans-serif;
  --font-body:'Tajawal','Cairo',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1D;
    --surface:#111A2E;
    --surface-2:#0D1526;
    --text:#E7ECF5;
    --muted:#8C9AB3;
    --border:#233150;
    --teal:#2DD4BF;
    --teal-dark:#14B8A6;
    --teal-tint:rgba(45,212,191,.12);
    --success-tint:rgba(22,163,74,.14);
    --warning-tint:rgba(217,119,6,.14);
    --danger-tint:rgba(220,38,38,.14);
    --shadow-md:0 10px 30px -8px rgba(0,0,0,.55), 0 4px 10px -4px rgba(0,0,0,.4);
    --shadow-lg:0 24px 60px -16px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1D;
  --surface:#111A2E;
  --surface-2:#0D1526;
  --text:#E7ECF5;
  --muted:#8C9AB3;
  --border:#233150;
  --teal:#2DD4BF;
  --teal-dark:#14B8A6;
  --teal-tint:rgba(45,212,191,.12);
  --success-tint:rgba(22,163,74,.14);
  --warning-tint:rgba(217,119,6,.14);
  --danger-tint:rgba(220,38,38,.14);
  --shadow-md:0 10px 30px -8px rgba(0,0,0,.55), 0 4px 10px -4px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px -16px rgba(0,0,0,.65);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.7;
  padding:0 20px;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;}
[hidden]{display:none!important;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance;color:var(--text);}
p{margin:0;color:var(--text);}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);cursor:pointer;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px;}
.wrap{max-width:1180px;margin:0 auto;}
.container{max-width:1180px;margin:0 auto;padding:0 4px;}
::selection{background:var(--teal-tint);color:var(--teal-dark);}

/* utility */
.muted{color:var(--muted);}
.center{text-align:center;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--teal-dark);
  background:var(--teal-tint);border:1px solid rgba(20,184,166,.25);
  padding:6px 14px;border-radius:999px;letter-spacing:.2px;
}
.grid{display:grid;gap:20px;}
.flex{display:flex;}
.section{padding-block:64px;}
.section-head{max-width:680px;margin:0 auto 40px;text-align:center;}
.section-head h2{font-size:clamp(26px,3.4vw,38px);margin-bottom:14px;}
.section-head p{color:var(--muted);font-size:17px;}
@media (max-width:720px){.section{padding-block:44px;}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:700;font-size:15px;border-radius:999px;border:1px solid transparent;
  padding:13px 26px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--teal);color:#04211D;box-shadow:0 8px 22px -6px rgba(20,184,166,.55);}
.btn-primary:hover{background:var(--teal-dark);box-shadow:0 10px 26px -6px rgba(20,184,166,.65);}
.btn-dark{background:var(--navy);color:#fff;}
.btn-dark:hover{background:var(--navy-soft);}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-dark);}
.btn-outline-light{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.35);}
.btn-outline-light:hover{background:rgba(255,255,255,.14);}
.btn-sm{padding:9px 18px;font-size:13.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.55;cursor:not-allowed;}

/* card */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
}
.card-pad{padding:26px;}

/* badge/chip */
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:5px 12px;border-radius:999px;
}
.chip-teal{background:var(--teal-tint);color:var(--teal-dark);border-color:rgba(20,184,166,.3);}
.badge-verified{
  display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;
  background:var(--success-tint);color:var(--success);border:1px solid rgba(22,163,74,.3);
  padding:4px 10px;border-radius:999px;
}
.badge-pending{
  display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;
  background:var(--warning-tint);color:var(--warning);border:1px solid rgba(217,119,6,.3);
  padding:4px 10px;border-radius:999px;
}

/* icon */
.icon{width:22px;height:22px;flex-shrink:0;}
.icon-wrap{
  width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:var(--teal-tint);color:var(--teal-dark);flex-shrink:0;
}

/* ===================== HEADER ===================== */
.site-header{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border);
  margin-inline:-20px;padding-inline:20px;
}
.nav-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:900;font-size:19px;cursor:pointer;flex-shrink:0;}
.brand-mark{
  width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,var(--teal),var(--teal-dark));
  color:#04211D;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:16px;flex-shrink:0;
}
.nav-links{display:flex;align-items:center;gap:26px;font-size:14.5px;font-weight:700;color:var(--muted);}
.nav-links a{padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s;}
.nav-links a:hover,.nav-links a.active{color:var(--text);}
.nav-links a.active{border-color:var(--teal);}
.nav-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-lang{border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);background:transparent;}
.menu-toggle{display:none;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px;}
.menu-toggle svg{width:22px;height:22px;}
@media (max-width:920px){
  .nav-links{position:fixed;inset-inline:20px;top:70px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    flex-direction:column;align-items:stretch;padding:14px;box-shadow:var(--shadow-lg);display:none;gap:4px;}
  .nav-links.open{display:flex;}
  .nav-links a{padding:12px 10px;border-radius:10px;border-bottom:none;}
  .nav-links a:hover,.nav-links a.active{background:var(--surface-2);}
  .menu-toggle{display:inline-flex;}
  .nav-actions .btn-ghost{display:none;}
}

/* ===================== HERO ===================== */
.hero{background:linear-gradient(180deg,var(--navy) 0%,#142238 65%,var(--navy) 100%);border-radius:32px;margin-top:22px;overflow:hidden;position:relative;color:#fff;}
.hero::before{content:'';position:absolute;inset:0;background:
  radial-gradient(60% 55% at 85% 0%, rgba(20,184,166,.28), transparent 60%),
  radial-gradient(45% 40% at 10% 100%, rgba(20,184,166,.16), transparent 60%);
  pointer-events:none;}
.hero-inner{position:relative;padding:64px 32px 20px;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center;max-width:1180px;margin:0 auto;}
.hero h1{color:#fff;font-size:clamp(32px,4.4vw,54px);line-height:1.18;}
.hero-sub{color:#C9D3E3;font-size:17.5px;margin-top:18px;max-width:520px;}
.hero-ctas{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
.hero-trust{margin-top:18px;color:#9DB2C9;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.hero-search-wrap{position:relative;padding:0 32px 48px;max-width:1180px;margin:0 auto;}
.search-bar{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:16px;backdrop-filter:blur(6px);}
.search-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;}
.search-field label{display:block;font-size:11.5px;color:#9DB2C9;font-weight:700;margin-bottom:6px;}
.search-field select,.search-field input{
  width:100%;background:rgba(255,255,255,.94);border:1px solid transparent;border-radius:11px;
  padding:11px 10px;font-size:13.5px;font-family:var(--font-body);color:var(--navy);font-weight:600;min-width:0;
}
.search-grid button{white-space:nowrap;}
@media (max-width:920px){.hero-inner{grid-template-columns:1fr;padding:44px 22px 0;}.hero-search-wrap{padding:0 22px 40px;}.search-grid{grid-template-columns:1fr 1fr;}.search-grid button{grid-column:1/-1;}}
@media (max-width:480px){.search-grid{grid-template-columns:1fr;}}

/* match preview card in hero */
.match-preview{background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow-lg);color:var(--text);}
.match-preview-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.score-ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:conic-gradient(var(--teal) calc(var(--pct)*1%), var(--surface-2) 0);}
.score-ring-inner{width:50px;height:50px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--teal-dark);font-family:var(--font-display);}
.match-reasons{display:grid;gap:9px;margin-top:14px;}
.match-reason{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;}
.match-reason svg{width:17px;height:17px;flex-shrink:0;}
.match-reason.yes{color:var(--text);}
.match-reason.yes svg{color:var(--success);}
.match-reason.no svg{color:var(--danger);}

/* ===================== GENERIC SECTIONS ===================== */
.pain-grid{grid-template-columns:repeat(3,1fr);}
.pain-card{padding:26px;}
.pain-card h3{font-size:18px;margin:14px 0 8px;}
.pain-card p{color:var(--muted);font-size:14.5px;}
@media (max-width:800px){.pain-grid{grid-template-columns:1fr;}}

.journey-grid{grid-template-columns:1fr 1fr;}
.journey-card{padding:34px;position:relative;overflow:hidden;}
.journey-card.doctor{background:linear-gradient(160deg,var(--navy),#1c2e4a);color:#fff;}
.journey-card.owner{background:var(--surface);}
.journey-card h3{font-size:24px;margin-bottom:6px;}
.journey-card.doctor h3{color:#fff;}
.journey-list{list-style:none;margin:20px 0 26px;padding:0;display:grid;gap:11px;}
.journey-list li{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;font-weight:600;}
.journey-list svg{width:19px;height:19px;flex-shrink:0;margin-top:1px;color:var(--teal);}
.journey-card.doctor .journey-list{color:#DCE4F0;}
.journey-card.owner .journey-list{color:var(--text);}
@media (max-width:800px){.journey-grid{grid-template-columns:1fr;}}

.steps-grid{grid-template-columns:repeat(4,1fr);}
.step-card{text-align:center;padding:22px 16px;}
.step-num{
  width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--font-display);font-weight:800;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:16px;
}
.step-card h4{font-size:15.5px;margin-bottom:6px;}
.step-card p{font-size:13.5px;color:var(--muted);}
@media (max-width:900px){.steps-grid{grid-template-columns:1fr 1fr;}}

.listing-grid{grid-template-columns:repeat(3,1fr);}
@media (max-width:980px){.listing-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:640px){.listing-grid{grid-template-columns:1fr;}}
.listing-card{overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s, transform .2s;cursor:pointer;}
.listing-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);}
.listing-thumb{
  height:150px;position:relative;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy),#20365a);color:rgba(255,255,255,.85);
}
.listing-thumb svg{width:38px;height:38px;opacity:.55;}
.listing-thumb .tag{position:absolute;top:10px;inset-inline-start:10px;}
.listing-thumb .tag2{position:absolute;top:10px;inset-inline-end:10px;}
.listing-body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.listing-title{font-family:var(--font-display);font-weight:800;font-size:16px;}
.listing-loc{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;}
.listing-loc svg{width:15px;height:15px;}
.listing-tags{display:flex;gap:6px;flex-wrap:wrap;}
.listing-meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-top:auto;}
.listing-price{font-family:var(--font-display);font-weight:900;color:var(--text);font-size:15px;}
.listing-price span{font-size:11.5px;color:var(--muted);font-weight:600;}

.feature-split{grid-template-columns:1fr 1fr;gap:36px;align-items:center;}
@media (max-width:800px){.feature-split{grid-template-columns:1fr;}}
.contact-split{grid-template-columns:1fr 1.3fr;gap:24px;align-items:start;}
@media (max-width:800px){.contact-split{grid-template-columns:1fr;}}
.nav-lang{display:inline-flex;}
@media (max-width:480px){.nav-lang{display:none;}}
@media (max-width:400px){.nav-actions{gap:6px;} .brand span{display:none;}}
.owners-band{background:var(--navy);border-radius:30px;color:#fff;padding:52px 36px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;}
.owners-band h2{color:#fff;font-size:clamp(24px,3vw,32px);}
.owners-feat{display:grid;gap:12px;margin:20px 0 24px;}
.owners-feat div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:#DCE4F0;font-weight:600;}
.owners-feat svg{width:18px;height:18px;color:var(--teal);flex-shrink:0;margin-top:2px;}
.owners-visual{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:24px;}
@media (max-width:860px){.owners-band{grid-template-columns:1fr;padding:34px 22px;}}

.trust-grid{grid-template-columns:repeat(5,1fr);}
.trust-item{text-align:center;padding:20px 10px;}
.trust-item svg{width:26px;height:26px;color:var(--teal-dark);margin-bottom:10px;}
.trust-item p{font-size:13px;font-weight:700;}
@media (max-width:900px){.trust-grid{grid-template-columns:repeat(2,1fr);}}

.faq-item{border-bottom:1px solid var(--border);}
.faq-q{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 4px;cursor:pointer;font-weight:700;font-size:15.5px;}
.faq-q svg{width:20px;height:20px;flex-shrink:0;transition:transform .2s;color:var(--muted);}
.faq-item.open .faq-q svg{transform:rotate(180deg);color:var(--teal-dark);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.faq-item.open .faq-a{max-height:600px;}
.faq-a p{padding:0 4px 18px;color:var(--muted);font-size:14.5px;line-height:1.8;}

.final-cta{background:linear-gradient(135deg,var(--teal-dark),var(--teal));border-radius:30px;padding:52px 30px;text-align:center;color:#04211D;}
.final-cta h2{color:#04211D;font-size:clamp(24px,3.2vw,34px);max-width:720px;margin:0 auto 22px;}
.final-cta .hero-ctas{justify-content:center;}

/* ===================== FOOTER ===================== */
.site-footer{margin-top:60px;border-top:1px solid var(--border);padding:48px 0 24px;}
.footer-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;padding-bottom:34px;}
.footer-cols h5{font-size:13.5px;margin-bottom:14px;color:var(--muted);font-weight:800;}
.footer-cols ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;}
.footer-cols a{font-size:14px;color:var(--text);font-weight:600;}
.footer-cols a:hover{color:var(--teal-dark);}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:22px;border-top:1px solid var(--border);color:var(--muted);font-size:13px;flex-wrap:wrap;gap:10px;}
@media (max-width:860px){.footer-top{grid-template-columns:1fr 1fr;}}
@media (max-width:520px){.footer-top{grid-template-columns:1fr;}}

/* ===================== GENERIC PAGE / FORM STYLES ===================== */
.page-hero{padding:46px 0 6px;}
.page-hero h1{font-size:clamp(26px,3.6vw,40px);}
.page-hero p{color:var(--muted);margin-top:12px;font-size:16px;max-width:620px;}
.breadcrumb{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:14px;}
.breadcrumb a:hover{color:var(--teal-dark);}

.two-col{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start;}
@media (max-width:860px){.two-col{grid-template-columns:1fr;}}
.filters-card{padding:20px;position:sticky;top:90px;}
.filter-group{margin-bottom:20px;}
.filter-group:last-child{margin-bottom:0;}
.filter-group > label{display:block;font-weight:800;font-size:13.5px;margin-bottom:10px;}
.filter-group select,.filter-group input[type=number],.filter-group input[type=text]{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);
  color:var(--text);font-family:var(--font-body);font-size:14px;
}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.check-row{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--text);}
.check-row input{width:16px;height:16px;accent-color:var(--teal);}
.budget-row{display:flex;gap:8px;align-items:center;}
.results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.results-head .count{font-weight:700;font-size:14.5px;}
.sort-select{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:13.5px;font-weight:600;}
.empty-state{padding:50px 20px;text-align:center;color:var(--muted);}
.empty-state svg{width:44px;height:44px;color:var(--border);margin-bottom:14px;}

/* forms */
.form-card{max-width:760px;margin:0 auto;padding:34px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid.full,.field-full{grid-column:1 / -1;}
.field label{display:block;font-weight:800;font-size:13.5px;margin-bottom:7px;}
.field .hint{font-size:12px;color:var(--muted);font-weight:500;margin-top:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface);
  color:var(--text);font-family:var(--font-body);font-size:14.5px;
}

  for(var k in (payload||{})) body[k] = payload[k];
  return fetch(FUNC_URL, { method:'POST', headers:supaHeaders(), body:JSON.stringify(body) })
    .then(function(res){ return res.json().then(function(data){
      if(!res.ok){ var err=new Error((data&&data.error)||('callApi:'+res.status)); err.status=res.status; throw err; }
      return data;
    }); });
}

    specialties:row.specialties||[], days:row.days||[], shift:row.shift, price:Number(row.price),
    facilities:row.facilities||[], medFacilities:row.med_facilities||[], verified:!!row.verified,
    desc:row.description||'', ownerName:row.owner_name||'', ownerPhone:row.owner_phone||'', ownerEmail:row.owner_email||'',
    trackingCode:row.tracking_code||'', status:row.status||'', isSeed:!!row.is_seed, createdAt:row.created_at

function normalizeRequestRow(row){

var LISTINGS_CACHE = null;
function fetchPublicListings(){
  return fetch(SUPA_URL+'/rest/v1/public_listings?select=*&order=created_at.desc', { headers:supaHeaders() })
    .then(function(res){ if(!res.ok) throw new Error('fetch listings:'+res.status); return res.json(); })
    .then(function(rows){ return rows.map(normalizeListingRow); });
}
function ensureListings(force){
  if(LISTINGS_CACHE && !force) return Promise.resolve(LISTINGS_CACHE);
  return fetchPublicListings().then(function(rows){
    LISTINGS_CACHE = rows; return LISTINGS_CACHE;
  }).catch(function(){ LISTINGS_CACHE = LISTINGS_CACHE || FALLBACK_LISTINGS; return LISTINGS_CACHE; });
}
function allListings(){ return LISTINGS_CACHE || FALLBACK_LISTINGS; }
function findListing(id){ var l=allListings(); for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
function genCode(prefix){ return prefix+'-'+Math.floor(10000+Math.random()*89999); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* ===================== MATCHING ALGORITHM ===================== */
function computeMatch(req, listing){
  var score = 0; var reasons = [];
  if(req.specialty){
    var pass = listing.specialties.indexOf(req.specialty) !== -1;
    if(pass) score += 30;
    reasons.push({label:'مناسبة للتخصص المطلوب', pass:pass});
  } else { score += 30; }
  var locPass = true, locScore = 0;
  if(req.district){
    if(listing.district === req.district){ locScore = 25; locPass = true; }
    else if(req.gov && listing.gov === req.gov){ locScore = 12; locPass = true; }
    else { locScore = 0; locPass = false; }
    reasons.push({label:'المنطقة مناسبة', pass:locPass});
  } else { locScore = 25; }
  score += locScore;
  var budgetPass = true, budgetScore = 0;
  if(req.budgetMax){
    if(listing.price <= Number(req.budgetMax)){ budgetScore = 20; budgetPass = true; }
    else if(listing.price <= Number(req.budgetMax)*1.15){ budgetScore = 9; budgetPass = false; }
    else { budgetScore = 0; budgetPass = false; }
    reasons.push({label:'داخل الميزانية', pass:budgetPass});
  } else { budgetScore = 20; }
  score += budgetScore;
  var daysPass = true, daysScore = 0;
  if(req.days && req.days.length){
    var overlap = req.days.filter(function(d){ return listing.days.indexOf(d) !== -1; });
    daysScore = Math.round((overlap.length/req.days.length)*15);
    daysPass = overlap.length > 0;
    reasons.push({label:'الأيام المطلوبة متاحة', pass:daysPass});
  } else { daysScore = 15; }
  score += daysScore;
  var facPass = true, facScore = 0;
  if(req.facilities && req.facilities.length){
    var have = req.facilities.filter(function(f){ return listing.facilities.indexOf(f)!==-1 || listing.medFacilities.indexOf(f)!==-1; });
    facScore = Math.round((have.length/req.facilities.length)*10);
    facPass = have.length === req.facilities.length;
    reasons.push({label:'الخدمات المطلوبة موجودة', pass:facPass});
  } else { facScore = 10; }
  score += facScore;
  return {score:Math.max(0,Math.min(100,Math.round(score))), reasons:reasons, listing:listing};
}
function topMatches(req, n){
  var list = allListings().map(function(l){ return computeMatch(req,l); });
  list.sort(function(a,b){ return b.score-a.score; });
  return list.slice(0, n||5);
}

/* ===================== ROUTER ===================== */
var routes = {};
function register(path, fn){ routes[path] = fn; }
function navigate(hash){ window.location.hash = hash; }
function currentRoute(){
  var h = window.location.hash.replace(/^#\/?/, '');
  var parts = h.split('?');
  var seg = parts[0].split('/').filter(Boolean);
  var query = {};
  if(parts[1]){ parts[1].split('&').forEach(function(kv){ var p=kv.split('='); if(p[0]) query[decodeURIComponent(p[0])] = decodeURIComponent(p[1]||''); }); }
  return {seg:seg, query:query, top: seg[0]||'home'};
}
function render(){
  var r = currentRoute();
  var app = document.getElementById('app');
  var key = r.top || 'home';
  var fn = routes[key] || routes['notfound'];
  window.scrollTo(0,0);
  app.innerHTML = '';
  updateNavActive(key);
  var toggle = document.querySelector('.nav-links');
  if(toggle) toggle.classList.remove('open');
  ensureListings().then(function(){ fn(app, r); }, function(){ fn(app, r); });
}
function updateNavActive(key){
  document.querySelectorAll('.nav-links a').forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-key')===key);
  });
}
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]');
  if(g){ navigate('/'+g.getAttribute('data-go')); }
});
window.addEventListener('hashchange', render);

register('find', function(root, r){
  var state = {
    district: r.query.district || '',
    gov: '',
    specialty: r.query.specialty || '',
    budgetMin: '', budgetMax: r.query.budget || '',
    rental: '',
    days: [],
    facilities: [],
    medFacilities: [],
    sort: 'match'
  };
  root.innerHTML =
  '<div class="container page-hero">'+
    '<div class="breadcrumb"><a href="#/">الرئيسية</a> '+icon('chev')+' <span>دوّر على عيادة</span></div>'+
    '<h1>دوّر على عيادة تناسبك</h1><p>فلتر بحسب المنطقة والتخصص والأيام والميزانية، وهنرتبلك النتائج بالأنسب لطلبك.</p>'+
  '</div>'+
  '<div class="section container" style="padding-top:26px;">'+
    '<div class="two-col">'+
      '<div class="card filters-card" id="filtersCard">'+
        '<div class="filter-group"><label>المحافظة</label><select id="fGov"><option value="">الكل</option>'+GOVERNORATES.map(function(g){return '<option value="'+esc(g)+'">'+esc(g)+'</option>';}).join('')+'</select></div>'+
        '<div class="filter-group"><label>المنطقة</label><select id="fDistrict"><option value="">كل المناطق</option>'+DISTRICTS.map(function(d){return '<option value="'+esc(d.name)+'">'+esc(d.name)+' ('+esc(d.gov)+')</option>';}).join('')+'</select></div>'+
        '<div class="filter-group"><label>التخصص الطبي</label><select id="fSpec"><option value="">كل التخصصات</option>'+SPECIALTIES.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join('')+'</select></div>'+
        '<div class="filter-group"><label>الميزانية الشهرية (ج.م)</label><div class="budget-row"><input type="number" id="fBudgetMin" placeholder="من"><span class="muted">—</span><input type="number" id="fBudgetMax" placeholder="إلى"></div></div>'+
        '<div class="filter-group"><label>نوع الإيجار</label><select id="fRental"><option value="">أي نوع</option>'+RENTAL_TYPES.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>';}).join('')+'</select></div>'+
        '<div class="filter-group"><label>الأيام المتاحة</label><div class="check-grid">'+DAYS.map(function(d){return '<label class="check-row"><input type="checkbox" class="fDay" value="'+d.id+'"> '+esc(d.name)+'</label>';}).join('')+'</div></div>'+
        '<div class="filter-group"><label>المرافق العامة</label><div class="check-grid">'+FACILITIES.map(function(f){return '<label class="check-row"><input type="checkbox" class="fFac" value="'+esc(f)+'"> '+esc(f)+'</label>';}).join('')+'</div></div>'+
        '<div class="filter-group"><label>المرافق الطبية</label><div class="check-grid">'+MED_FACILITIES.map(function(f){return '<label class="check-row"><input type="checkbox" class="fMed" value="'+esc(f)+'"> '+esc(f)+'</label>';}).join('')+'</div></div>'+
        '<button class="btn btn-ghost btn-block" id="fReset">إعادة ضبط الفلاتر</button>'+
      '</div>'+
      '<div>'+
        '<div class="results-head"><span class="count" id="resultCount"></span>'+
          '<select class="sort-select" id="fSort"><option value="match">الأفضل توافقًا</option><option value="price-asc">الأقل سعرًا</option><option value="newest">الأحدث</option><option value="avail">الأكثر توفرًا للأيام</option></select>'+
        '</div>'+
        '<div class="grid listing-grid" id="resultsGrid"></div>'+
      '</div>'+
    '</div>'+
  '</div>';

  document.getElementById('fDistrict').value = state.district;
  document.getElementById('fSpec').value = state.specialty;
  document.getElementById('fBudgetMax').value = state.budgetMax;
  if(r.query.shift) document.getElementById('fRental').value = r.query.shift;

  function readState(){
    state.gov = document.getElementById('fGov').value;
    state.district = document.getElementById('fDistrict').value;
    state.specialty = document.getElementById('fSpec').value;
    state.budgetMin = document.getElementById('fBudgetMin').value;
    state.budgetMax = document.getElementById('fBudgetMax').value;
    state.rental = document.getElementById('fRental').value;
    state.sort = document.getElementById('fSort').value;
    state.days = Array.prototype.map.call(root.querySelectorAll('.fDay:checked'), function(c){return c.value;});
    state.facilities = Array.prototype.map.call(root.querySelectorAll('.fFac:checked'), function(c){return c.value;});
    state.medFacilities = Array.prototype.map.call(root.querySelectorAll('.fMed:checked'), function(c){return c.value;});
  }
  function apply(){
    readState();
    var items = allListings().filter(function(l){
      if(state.gov && l.gov!==state.gov) return false;
      if(state.district && l.district!==state.district) return false;
      if(state.specialty && l.specialties.indexOf(state.specialty)===-1) return false;
      if(state.budgetMin && l.price < Number(state.budgetMin)) return false;
      if(state.budgetMax && l.price > Number(state.budgetMax)) return false;
      if(state.rental && ['morning','evening','full','flex'].indexOf(state.rental)!==-1 && l.shift!==state.rental) return false;
      if(state.days.length && !state.days.some(function(d){return l.days.indexOf(d)!==-1;})) return false;
      if(state.facilities.length && !state.facilities.every(function(f){return l.facilities.indexOf(f)!==-1;})) return false;
      if(state.medFacilities.length && !state.medFacilities.every(function(f){return l.medFacilities.indexOf(f)!==-1;})) return false;
      return true;
    });
    var req = {district:state.district, gov:state.gov, specialty:state.specialty, budgetMax:state.budgetMax, days:state.days, facilities:state.facilities.concat(state.medFacilities)};
    var scored = items.map(function(l){ return computeMatch(req,l); });
    if(state.sort==='match') scored.sort(function(a,b){return b.score-a.score;});
    else if(state.sort==='price-asc') scored.sort(function(a,b){return a.listing.price-b.listing.price;});
    else if(state.sort==='newest') scored.reverse();
    else if(state.sort==='avail') scored.sort(function(a,b){return b.listing.days.length-a.listing.days.length;});
    var grid = document.getElementById('resultsGrid');
    document.getElementById('resultCount').textContent = scored.length + ' مكان متاح';
    if(!scored.length){
      grid.innerHTML = '<div class="empty-state card" style="grid-column:1/-1;">'+icon('search')+'<h3>مفيش نتائج مطابقة</h3><p>جرب توسّع نطاق الفلاتر، أو قدّم طلبك واحنا هنبحث لك.</p><a href="#/need-clinic" class="btn btn-primary btn-sm" style="margin-top:14px;">قدّم طلب دلوقتي</a></div>';
      return;
    }
    grid.innerHTML = scored.map(function(m){ return listingCard(m.listing); }).join('');
  }
  root.querySelectorAll('#fGov,#fDistrict,#fSpec,#fBudgetMin,#fBudgetMax,#fRental,#fSort').forEach(function(el){ el.addEventListener('change', apply); });
  root.querySelectorAll('.fDay,.fFac,.fMed').forEach(function(el){ el.addEventListener('change', apply); });
  document.getElementById('fReset').addEventListener('click', function(){
    root.querySelectorAll('#filtersCard select').forEach(function(s){ s.value=''; });
    root.querySelectorAll('#filtersCard input[type=checkbox]').forEach(function(c){ c.checked=false; });
    root.querySelectorAll('#filtersCard input[type=number]').forEach(function(i){ i.value=''; });
    apply();
  });
  apply();
});

register('matches', async function(root, r){
  var req = null, isDemo = false;
  var code = r.query.code;
  if(code){
    try{
      var lookupRes = await callApi('lookup_by_code', {code:code});
      if(lookupRes && lookupRes.type==='doctor' && lookupRes.row) req = normalizeRequestRow(lookupRes.row);
    }catch(e){}
  }
  if(!req){
    try{ var last = sessionStorage.getItem('cs_last_request'); if(last) req = JSON.parse(last); }catch(e){}
  }
  if(!req){
    isDemo = true;
    req = {name:'', specialty:'باطنة', gov:'', district:'', budgetMax:'7000', days:['sat','mon','wed'], facilities:['استقبال','واي فاي','تكييف']};
  }
  var matches = topMatches(req, 6).filter(function(m){ return m.score>0; });
  root.innerHTML =
  '<div class="container page-hero"><div class="breadcrumb"><a href="#/">الرئيسية</a> '+icon('chev')+' <span>نتائج المطابقة</span></div>'+
  '<h1>أفضل الأماكن المتاحة ليك دلوقتي</h1>'+
  (isDemo ?
    '<div class="legal-note" style="margin-top:16px;">'+icon('info')+' دي نتيجة توضيحية بمواصفات افتراضية (تخصص باطنة، ميزانية حتى ٧,٠٠٠ ج.م). <a href="#/need-clinic" style="text-decoration:underline;">قدّم طلبك الحقيقي دلوقتي</a> لنتيجة مخصصة ليك.</div>'
  : '<p>طلبك رقم <b>'+esc(req.trackingCode||'')+'</b> تحت المراجعة، وده أفضل الأماكن المتاحة حاليًا حسب بياناتك.</p>')+
  '</div>'+
  '<div class="section container" style="padding-top:10px;">'+
    (matches.length ? '<div class="grid" style="gap:16px;">'+matches.map(function(m){ return matchCard(m); }).join('')+'</div>' :
      '<div class="empty-state card">'+icon('search')+'<h3>لسه مفيش أماكن مطابقة كفاية</h3><p>هنكمل نبحث لك ونضيف أماكن جديدة قريب.</p></div>')+
    '<div class="center" style="margin-top:30px;"><a href="#/need-clinic" class="btn btn-ghost">قدّم طلب جديد</a></div>'+
  '</div>';

  root.querySelectorAll('[data-int]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var lid = btn.getAttribute('data-int');
      btn.disabled = true;
      supaInsert('interests', {listing_id:lid, name:req.name||'', phone:req.phone||'', specialty:req.specialty||''}).then(function(){
        btn.textContent = 'تم إرسال الاهتمام ✔';
      }).catch(function(){
        btn.disabled = false;
        toast('حصل خطأ، حاول تاني.');
      });
    });
  });
});
function matchCard(m){
  var l = m.listing;
  return '<div class="card match-card">'+
    scoreRing(m.score)+
    '<div><div class="listing-title">'+esc(l.title)+'</div>'+
    '<div class="listing-loc" style="margin-top:4px;">'+icon('pin')+esc(l.district)+' — '+esc(l.gov)+'</div>'+
    '<div class="match-reasons" style="grid-template-columns:1fr 1fr;display:grid;margin-top:12px;">'+m.reasons.map(function(rs){
      return '<div class="match-reason '+(rs.pass?'yes':'no')+'">'+icon(rs.pass?'check':'x')+' '+esc(rs.label)+'</div>';
    }).join('')+'</div></div>'+
    '<div style="text-align:center;"><div class="listing-price">'+l.price.toLocaleString('en-US')+'<span> ج.م/شهريًا</span></div>'+
    '<a href="#/clinic/'+l.id+'" class="btn btn-ghost btn-sm" style="margin-top:10px;">التفاصيل</a>'+
    '<button class="btn btn-primary btn-sm btn-block" style="margin-top:8px;" data-int="'+l.id+'">أنا مهتم</button></div>'+
  '</div>';
}

function renderAdminPanel(root, pass){
  root.innerHTML = '<div class="section container"><div class="empty-state card">'+icon('info')+'<p>جاري تحميل بيانات لوحة التحكم...</p></div></div>';
  Promise.all([
    callApi('admin_list', {table:'listings', pass:pass}),
    callApi('admin_list', {table:'requests', pass:pass}),
    callApi('admin_list', {table:'contacts', pass:pass})
  ]).then(function(results){
    var listings = (results[0].rows||[]).map(normalizeListingRow);
    var requests = (results[1].rows||[]).map(normalizeRequestRow);
    var contacts = (results[2].rows||[]).map(function(row){ return {id:row.id, name:row.name, contact:row.contact, subject:row.subject, message:row.message, createdAt:row.created_at}; });
    renderAdminPanelBody(root, pass, listings, requests, contacts);
  }).catch(function(e){
    if(e && e.status===401){
      sessionStorage.removeItem('cs_admin_pass');
      toast('انتهت الجلسة، سجّل دخولك تاني');
      navigate('/admin'); render();
      return;
    }
    root.innerHTML = '<div class="section container"><div class="empty-state card">'+icon('info')+'<p>حصل خطأ في تحميل بيانات لوحة التحكم. حاول تحدّث الصفحة.</p></div></div>';

function renderAdminPanelBody(root, pass, listings, requests, contacts){
  var pendingL = listings.filter(function(l){return !l.verified;}).length;
  root.innerHTML =
  '<div class="section container">'+
    '<div class="dash-header"><div><span class="chip chip-teal">'+icon('dashboard')+' لوحة تحكم الأدمن</span><h1 style="margin-top:10px;font-size:26px;">مرحبًا بفريق '+BRAND.name+'</h1></div>'+
    '<button class="btn btn-ghost btn-sm" id="adminLogout">'+icon('logout')+' خروج</button></div>'+
    '<div class="legal-note">'+icon('info')+' البيانات هنا محفوظة في قاعدة بيانات مركزية حقيقية يشاركها كل الزوار والفريق مباشرة.</div>'+
    '<div class="grid kpi-grid">'+
      '<div class="card kpi-card"><div class="val">'+listings.length+'</div><div class="lbl">إجمالي المساحات</div></div>'+
      '<div class="card kpi-card"><div class="val">'+pendingL+'</div><div class="lbl">مساحات قيد المراجعة</div></div>'+
      '<div class="card kpi-card"><div class="val">'+requests.length+'</div><div class="lbl">طلبات دكاترة</div></div>'+
      '<div class="card kpi-card"><div class="val">'+contacts.length+'</div><div class="lbl">رسائل تواصل</div></div>'+
    '</div>'+
    '<div class="tab-bar">'+
      '<button class="tab-btn active" data-tab="listings">المساحات</button>'+
      '<button class="tab-btn" data-tab="requests">طلبات الدكاترة</button>'+
      '<button class="tab-btn" data-tab="contacts">رسائل التواصل</button>'+
    '</div>'+
    '<div id="adminTabBody"></div>'+
  '</div>';
  document.getElementById('adminLogout').addEventListener('click', function(){ sessionStorage.removeItem('cs_admin_pass'); navigate('/'); });
  function showTab(tab){
    root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===tab); });
    var body = document.getElementById('adminTabBody');
    if(tab==='listings'){
      body.innerHTML = '<div class="table-wrap card"><table class="data-table"><tr><th>المكان</th><th>المنطقة</th><th>السعر</th><th>الحالة</th><th>مصدر</th><th>إجراء</th></tr>'+
        listings.map(function(l){
          var isDemo = l.isSeed;
          return '<tr><td>'+esc(l.title)+'</td><td>'+esc(l.district)+'</td><td>'+l.price.toLocaleString('en-US')+' ج.م</td>'+
          '<td>'+(l.verified?'<span class="badge-verified">موثّقة</span>':'<span class="badge-pending">قيد المراجعة</span>')+'</td>'+
          '<td class="muted">'+(isDemo?'بيانات تجريبية':'مُقدَّم من مستخدم')+'</td>'+
          '<td>'+(isDemo?'—':'<button class="btn btn-ghost btn-sm" data-verify="'+l.id+'" data-verified="'+(l.verified?'1':'0')+'">'+(l.verified?'إلغاء التوثيق':'توثيق ✔')+'</button>')+'</td></tr>';
        }).join('')+'</table></div>';
      body.querySelectorAll('[data-verify]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id=btn.getAttribute('data-verify'); var current=btn.getAttribute('data-verified')==='1';
          btn.disabled = true;
          callApi('admin_update', {table:'listings', id:id, patch:{verified: !current}, pass:pass}).then(function(){
            ensureListings(true);
            renderAdminPanel(root, pass);
          }).catch(function(){ btn.disabled=false; toast('حصل خطأ، حاول تاني.'); });
        });
      });
    } else if(tab==='requests'){
      body.innerHTML = requests.length ? '<div class="table-wrap card"><table class="data-table"><tr><th>الاسم</th><th>التخصص</th><th>المنطقة</th><th>الميزانية</th><th>كود التتبع</th><th>أفضل Match</th></tr>'+
        requests.map(function(rq){
          var best = topMatches(rq,1)[0];
          return '<tr><td>'+esc(rq.name)+'</td><td>'+esc(rq.specialty)+'</td><td>'+esc(rq.district||'أي منطقة')+'</td><td>'+(rq.budgetMax?Number(rq.budgetMax).toLocaleString('en-US'):'—')+'</td><td>'+esc(rq.trackingCode)+'</td><td>'+(best?best.score+'% — '+esc(best.listing.title):'—')+'</td></tr>';
        }).join('')+'</table></div>' : '<div class="empty-state card">'+icon('info')+'<p>لسه مفيش طلبات دكاترة مسجّلة.</p></div>';
    } else {
      body.innerHTML = contacts.length ? '<div class="table-wrap card"><table class="data-table"><tr><th>الاسم</th><th>التواصل</th><th>الموضوع</th><th>الرسالة</th></tr>'+
        contacts.map(function(c){return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.contact)+'</td><td>'+esc(c.subject||'—')+'</td><td style="white-space:normal;max-width:300px;">'+esc(c.message)+'</td></tr>';}).join('')+'</table></div>' : '<div class="empty-state card">'+icon('mail')+'<p>لسه مفيش رسائل تواصل.</p></div>';
    }
  }
  root.querySelectorAll('.tab-btn').forEach(function(b){ b.addEventListener('click', function(){ showTab(b.getAttribute('data-tab')); }); });
  showTab('listings');
}
